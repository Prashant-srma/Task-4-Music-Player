<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player | Task 4</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app">
    <section class="player-card">
      <div class="topbar">
        <span class="task-label">TASK 4</span>
        <h1>Music Player</h1>
        <label class="upload-btn" title="Add your own MP3 files">
          + Add Songs
          <input id="fileInput" type="file" accept="audio/*" multiple hidden>
        </label>
      </div>

      <div class="player-content">
        <div class="cover">
          <div class="vinyl"><div class="vinyl-center"></div></div>
          <div class="music-note">♪</div>
        </div>

        <div class="song-info">
          <p class="now-playing">NOW PLAYING</p>
          <h2 id="songTitle">Demo Song</h2>
          <p id="artist">SoundHelix</p>

          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
          <input id="progress" class="range" type="range" min="0" max="100" value="0" aria-label="Song progress">

          <div class="controls">
            <button id="prevBtn" class="control secondary" title="Previous">⏮</button>
            <button id="playBtn" class="control play" title="Play/Pause">▶</button>
            <button id="nextBtn" class="control secondary" title="Next">⏭</button>
          </div>

          <div class="volume-row">
            <span>🔊</span>
            <input id="volume" class="range" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
            <span id="volumeValue">80%</span>
          </div>

          <div class="options">
            <label class="toggle">
              <input id="autoplay" type="checkbox">
              <span class="slider"></span>
              Autoplay
            </label>
            <button id="shuffleBtn" class="small-btn">🔀 Shuffle</button>
          </div>
        </div>
      </div>

      <div class="playlist-header">
        <h3>Playlist</h3>
        <span id="songCount">1 song</span>
      </div>
      <div id="playlist" class="playlist"></div>
    </section>
  </main>

  <audio id="audio"></audio>
  <script src="script.js"></script>
</body>
</html>
